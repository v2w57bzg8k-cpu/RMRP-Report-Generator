services:
  - type: web
    name: rmrp-report-generator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: APP_SECRET
        generateValue: true
      - key: ADMIN_PIN
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
